name: Run Tests

on:
  push:
    branches:
      - 'NEXT_*'
  pull_request:
    branches:
      - 'NEXT_*'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pytest
        run: uv run pytest
