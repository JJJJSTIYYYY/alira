[project]
name = "apix"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "fastapi>=0.139.2",
    "httpx[socks]>=0.28.1",
    "inflect>=7.5.0",
    "sqlalchemy[asyncio]>=2.0.44,<3",
    "pyyaml>=6.0.3",
    "redis>=8.0.1",
    "uvicorn>=0.51.0",
    "fastmcp-slim[client]==3.4.7",
    "apixis==1.1.5",
    "pydantic>=2.12",
    "my-llm-py[all]==1.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# Process-global runtime queues share one asyncio loop across tests.
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
]
