[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "alira-harness"
dynamic = ["version"]
description = "Alira Harness"
readme = "README.md"
requires-python = ">=3.12"
license-files = ["LICENSE"]
dependencies = [
    "apixis>=1.1.7",
    "packaging>=24.2",
    "pyyaml>=6.0.3",
    "send2trash>=1.8.3",
]

[project.optional-dependencies]
embedding = [
    "sentence-transformers>=5.7,<6",
    "sqlite-vec>=0.1.6,<0.2",
]

[project.urls]
Repository = "https://github.com/JJJJSTIYYYY/alira"
Issues = "https://github.com/JJJJSTIYYYY/alira/issues"

[project.scripts]
alira = "alira.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["alira", "alira.*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "alira._version.__version__"}

[tool.setuptools.package-data]
"alira.modules" = ["*/requirements.txt"]

[tool.uv]
cache-keys = [{file = "pyproject.toml"}, {file = "src/alira/_version.py"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
# Process-global runtime queues share one asyncio loop across tests.
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
]
